<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Library</title>
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>
<body>
	<div class="main-container">
		<div class="library">
			<div class="table-header">
				<div></div>
				<div>Name</div>
				<div>Author</div>
				<div>Pages</div>
				<div>Did you read?</div>
				<div>Id</div>
			</div>
		</div>
		<div class="button-container">
			<button id="new-book-btn" type="button">New Book</button>
		</div>
		<form action="" method="post">
			<legend>Enter book information:</legend>
			<label for="bookName">Name: </label>
			<input id="bookName" name="bookName" type="text" required>
			<label for="bookAuthor">Author: </label>
			<input id="bookAuthor" name="bookAuthor" type="text" required>
			<label for="bookPages">Pages: </label>
			<input id="bookPages" name="bookPages" type="number" required>
			<label for="bookIsRead">Did you read?: </label>
			<div>
				<label>
					<input type="radio" name="bookIsRead" value="No" checked>
					No
				</label>
				<label>
					<input type="radio" name="bookIsRead" value="Yes">
					Yes
				</label>
			</div>
			<button type="button" id="add-book-btn">Add Book</button>
		</form>
	</div>
</body>
</html>
