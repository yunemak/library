<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Library</title>
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>
<body>
	<div class="main-container">
		<div class="library">
			<div class="table-header">
				<p>Name</p>
				<p>Author</p>
				<p>Pages</p>
				<p>Is Read?</p>
				<p>Id</p>
			</div>
		</div>
		<button id="new-book-btn" type="button">New Book</button>
		<form>
			<legend>Enter book information:</legend>
			<label for="name">Name: </label>
			<input id="name" name="bookName" type="text">
			<label for="author">Author: </label>
			<input id="author" name="bookAuthor" type="text">
			<label for="pages">Pages: </label>
			<input id="pages" name="bookPages" type="text">
			<label for="read">Did you read?: </label>
			<input id="read" name="bookIsRead" type="text">
		</form>
		<button id="add-book-btn">Add Book</button>
	</div>
</body>
</html>
