<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Library</title>
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>
<body>
	<div class="main-container">
		<div class="library">
			<div class="table-header">
				<p></p>
				<p>Name</p>
				<p>Author</p>
				<p>Pages</p>
				<p>Is Read?</p>
				<p>Id</p>
			</div>
		</div>
		<button id="new-book-btn" type="button">New Book</button>
		<form>
			<legend>Enter book information:</legend>
			<label for="bookName">Name: </label>
			<input id="bookName" name="bookName" type="text">
			<label for="bookAuthor">Author: </label>
			<input id="bookAuthor" name="bookAuthor" type="text">
			<label for="bookPages">Pages: </label>
			<input id="bookPages" name="bookPages" type="text">
			<label for="bookIsRead">Did you read?: </label>
			<div>
				<label>
					<input type="radio" id="bookIsRead" name="bookIsRead" value="No" checked>
					No
				</label>
				<label>
					<input type="radio" id="bookIsRead" name="bookIsRead" value="Yes">
					Yes
				</label>
			</div>
		</form>
		<button id="add-book-btn">Add Book</button>
	</div>
</body>
</html>
