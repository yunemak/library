<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Library</title>
	<link rel="stylesheet" href="style.css">
	<script src="script.js" defer></script>
</head>
<body>
	<div class="main-container">
		<div class="library">
			<div class="table-header">
				<p>Name</p>
				<p>Author</p>
				<p>Pages</p>
				<p>Is Read?</p>
				<p>Id</p>
			</div>
		</div>
		<button id="new-book-btn" type="button">New Book</button>
		<form>
			<legend>Enter book information:</legend>
			<div>
				<label>Name: </label>
				<input type="text">
			</div>
			<div>
				<label>Author: </label>
				<input type="text">
			</div>
			<div>
				<label>Pages: </label>
				<input type="text">
			</div>
			<div>
				<label>Did you read?: </label>
				<input type="text">
			</div>
		</form>
		<button id="add-book-btn">Add Book</button>
	</div>
</body>
</html>
